<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Universe IO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage"></div>

  <div id="hud" hidden>
    <aside id="leaderboard" class="panel">
      <h3>Leaderboard</h3>
      <ol id="lb-list"></ol>
      <div id="lb-me" hidden></div>
    </aside>

    <aside id="progress" class="panel">
      <div class="prog-row">
        <div id="icon-cur" class="lvl-icon"></div>
        <div class="bar"><div id="prog-fill" class="fill"></div></div>
        <div id="icon-next" class="lvl-icon"></div>
      </div>
      <div class="prog-labels"><span id="lvl-cur"></span><span id="lvl-next"></span></div>
      <div id="real-mass"></div>
    </aside>

    <div id="toast" class="toast" hidden>
      <div class="toast-title"></div>
      <div class="toast-body"></div>
    </div>
  </div>

  <section id="join" class="overlay">
    <form id="join-form" class="card">
      <h1>Universe<span> IO</span></h1>
      <p class="tagline">Start as a speck of dust. Grow into a galaxy.</p>
      <input id="name" name="name" maxlength="16" placeholder="Your name" autocomplete="off" autofocus>
      <button type="submit">Confirm</button>
      <p class="hint mouse-hint">Steer with your mouse · hold click to boost (costs mass)</p>
      <p class="hint touch-hint">Drag on the left to steer · hold BOOST on the right (costs mass)</p>
      <p id="join-status" class="status"></p>
    </form>
  </section>

  <section id="dead" class="overlay" hidden>
    <div class="card">
      <h2>Swallowed!</h2>
      <p id="dead-msg"></p>
      <p id="dead-fact" class="fact"></p>
      <button id="again" type="button">Play again</button>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
